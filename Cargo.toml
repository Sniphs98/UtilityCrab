[package]
name = "utility_crab"
version = "0.1.0"
edition = "2021"
description = "Kleines Windows-Tray-Tool: Text vorlesen und Text aus Bildern kopieren"

[dependencies]
tray-icon = "0.26"
global-hotkey = "0.9"
arboard = "3.7"
ort = "2.0.0-rc.15"
serde_json = "1"
unicode-normalization = "0.1"
whatlang = "0.16"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }
oxipng = { version = "10", default-features = false, features = ["parallel"] }
webp = { version = "0.3", default-features = false }
winreg = "0.56"
rayon = "1"
raw-window-handle = "0.6"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Media_Core",
    "Media_Ocr",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
strip = true

[build-dependencies]
winresource = "0.1"
